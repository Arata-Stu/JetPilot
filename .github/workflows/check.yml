name: Lightweight checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Standard-library and syntax checks
        run: ./scripts/diagnostics/check.sh quick
      - name: Frontend regression tests
        run: ./scripts/diagnostics/check.sh frontend
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.0'
      - name: Lock and generated requirements consistency
        env:
          JETPILOT_ENV_PYTHON: python3
        run: ./scripts/diagnostics/check.sh locks
