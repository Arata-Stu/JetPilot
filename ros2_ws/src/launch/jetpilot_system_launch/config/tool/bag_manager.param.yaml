bag_manager_node:
  ros__parameters:
    output_dir: "/workspaces/record"
    ## JetPilot default: record only explicitly listed topics.
    record_all: false
    topics:
      ## Control and operation state.
      - /joy
      - /rc/channels
      - /teleop/control_cmd
      - /propo/control_cmd
      - /auto/control_cmd
      - /vehicle/control_cmd
      - /operation_mode/request
      - /operation_mode/state
      - /bag/request
      - /bag/status

      ## Vehicle interface feedback.
      - /commands/motor/speed
      - /commands/motor/brake
      - /commands/servo/position
      - /sensors/core
      - /sensors/imu
      - /sensors/imu/raw
      - /sensors/servo_position_command

      ## TF is required for replay, localization, and sensor alignment.
      - /tf
      - /tf_static
      - /robot_description
      - /joint_states

      ## SilkyEvCam event camera.
      - /event_camera/camera_info
      - /event_camera/events
      - /event_camera/events_raw
      - /event_camera/event_image
      - /event_camera/diagnostics

      ## RealSense RGB candidates. CameraInfo is required for offline VSLAM.
      - /realsense/color/camera_info
      - /realsense/color/image_raw
      - /realsense/color/image_raw/compressed
      - /realsense/color/metadata

      ## RealSense depth candidates. Enable only when depth replay is needed.
      # - /realsense/depth/camera_info
      # - /realsense/depth/image_rect_raw
      # - /realsense/depth/image_rect_raw/compressedDepth
      # - /realsense/depth/metadata

      ## RealSense stereo infrared candidates. CameraInfo is required for offline VSLAM.
      - /realsense/infra1/camera_info
      - /realsense/infra1/image_rect_raw
      - /realsense/infra1/image_rect_raw/compressed
      - /realsense/infra1/image_rect_raw/compressedDepth
      - /realsense/infra1/image_rect_raw/zstd
      - /realsense/infra1/metadata
      - /realsense/infra2/camera_info
      - /realsense/infra2/image_rect_raw
      - /realsense/infra2/image_rect_raw/compressed
      - /realsense/infra2/image_rect_raw/compressedDepth
      - /realsense/infra2/image_rect_raw/zstd
      - /realsense/infra2/metadata
      - /realsense/extrinsics/depth_to_infra1
      - /realsense/extrinsics/depth_to_infra2
    exclude_topics: []

    ## Storage backend. Use "mcap" for modern rosbag2 recording, or "sqlite3" if needed.
    storage_id: "mcap"
    serialization_format: ""

    ## Splitting. Values of 0 disable each split condition.
    ## max_bag_size is bytes. max_bag_duration is seconds.
    max_bag_size: 0
    max_bag_duration: 0

    ## Recorder cache in bytes. 0 keeps rosbag2 default.
    max_cache_size: 0

    ## Compression. Common values:
    ## compression_mode: "" | "file" | "message"
    ## compression_format: "" | "zstd"
    compression_mode: ""
    compression_format: ""
    compression_queue_size: 0
    compression_threads: 0

    ## Optional YAML path for per-topic QoS overrides.
    qos_profile_overrides_path: ""

    include_hidden_topics: false
    no_discovery: false
    snapshot_mode: false
    start_paused: false

    ## Escape hatch for ros2 bag record flags not modeled above.
    extra_args: []
    status_period_s: 1.0
