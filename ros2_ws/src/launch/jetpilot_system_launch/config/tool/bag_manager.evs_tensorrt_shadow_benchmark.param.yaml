bag_manager_node:
  ros__parameters:
    output_dir: "/workspaces/record"
    record_all: false

    # Manual-driving shadow benchmark. TensorRT output is intentionally
    # remapped away from /auto/control_cmd and is recorded for analysis only.
    # Native RAW and event payload stay disabled to avoid perturbing latency.
    topics:
      - /bag/request
      - /bag/status
      - /tf_static

      - /event_camera/camera_info
      - /event_camera/diagnostics
      - /e2e/event_tensor/diagnostics
      - /e2e/diagnostics
      - /benchmark/e2e/control_cmd
      - /jetson/diagnostics

      - /joy/diagnostics
      - /teleop/control_cmd
      - /vehicle/control_cmd
      - /operation_mode/state

    exclude_topics: []
    storage_id: "mcap"
    serialization_format: ""
    max_bag_size: 0
    recording_split_duration_s: 0
    max_cache_size: 0
    compression_mode: ""
    compression_format: ""
    compression_queue_size: 0
    compression_threads: 0
    qos_profile_overrides_path: ""
    include_hidden_topics: false
    no_discovery: false
    snapshot_mode: false
    start_paused: false
    extra_args: []
    status_period_s: 1.0
    raw_recording_request_topic: ""
    recording_start_timeout_s: 5.0
