/**:
  ros__parameters:
    # JetPilot default: stereo infrared only.
    # Unknown or device-dependent parameters are intentionally omitted so the
    # RealSense driver can keep its own validated defaults.
    #
    # Common compact profile candidates:
    #   depth_module.infra_profile: "424x240x15", "424x240x30", "640x480x15", "640x480x30"
    #   depth_module.depth_profile: "424x240x15", "424x240x30", "640x480x15", "640x480x30"
    #   rgb_camera.color_profile: "424x240x15", "424x240x30", "640x480x15", "640x480x30"
    # If the camera rejects a profile, verify supported modes with rs-enumerate-devices.

    # Device selection / node basics.
    serial_no: ""
    usb_port_id: ""
    device_type: ""
    wait_for_device_timeout: -1.0
    reconnect_timeout: 6.0
    initial_reset: false
    use_sim_time: false

    camera_name: "realsense"
    base_frame_id: "camera_link"
    publish_tf: true
    tf_publish_rate: 0.0

    # Enable only the stereo infrared pair by default. RGB is disabled because
    # some D435I units can expose depth/motion while the RGB sensor is unavailable.
    enable_infra1: true
    enable_infra2: true
    enable_color: false
    enable_depth: false
    enable_rgbd: false
    enable_accel: false
    enable_gyro: false
    enable_sync: false

    # Small profiles for Jetson bringup. Increase after stability is confirmed.
    depth_module.infra_profile: "640x480x15"
    depth_module.infra1_format: "Y8"
    depth_module.infra2_format: "Y8"
    # Enable depth only for diagnostics if infra frames are advertised but do not flow.
    # enable_depth: true
    # depth_module.depth_profile: "640x480x15"
    # depth_module.depth_format: "Z16"
    # Enable these only after RGB is visible in RealSense Viewer.
    # enable_color: true
    # rgb_camera.color_profile: "424x240x6"
    # rgb_camera.color_profile: "640x480x15"
    # rgb_camera.color_format: "RGB8"

    # Keep optional processing off unless a workflow explicitly needs it.
    align_depth.enable: false
    colorizer.enable: false
    decimation_filter.enable: false
    disparity_filter.enable: false
    disparity_to_depth.enable: false
    hdr_merge.enable: false
    hole_filling_filter.enable: false
    pointcloud.enable: false
    spatial_filter.enable: false
    temporal_filter.enable: false

    # Transport QoS only. Image transport plugin parameters are omitted because
    # the RealSense wrapper derives plugin class names internally.
    infra1_qos: "SENSOR_DATA"
    infra1_info_qos: "SENSOR_DATA"
    infra2_qos: "SENSOR_DATA"
    infra2_info_qos: "SENSOR_DATA"
    color_qos: "SENSOR_DATA"
    color_info_qos: "SENSOR_DATA"
