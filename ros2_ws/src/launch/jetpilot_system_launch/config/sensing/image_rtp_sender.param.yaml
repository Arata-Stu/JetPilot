image_rtp_sender:
  ros__parameters:
    image_topic: "/realsense/color/image_raw"
    # Required when RTP streaming is enabled. Use the notebook receiver IP address.
    host: ""
    port: 5004
    codec: "h264"
    fps: 60
    bitrate: 4000000
    gop: 60
    mtu: 1200
    payload: 96
    encoder: "auto"
    h264_encoder_extra: "num-B-Frames=0 preset-level=1"
    h265_encoder_extra: "num-B-Frames=0 preset-level=1"
    # Healthy status/info logs are opt-in. Warnings and errors are always reported.
    enable_status_log: false
