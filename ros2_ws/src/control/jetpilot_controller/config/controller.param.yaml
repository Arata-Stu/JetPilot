path_tracking_controller_node:
  ros__parameters:
    # Available: pure_pursuit, map_pursuit, kinematic_mpc.
    algorithm: pure_pursuit

    # ROS interfaces. planning publishes latched trajectory, speed and readiness.
    base_frame: base_link
    trajectory_topic: /planning/trajectory
    # Typed profile is optional and authoritative when non-empty. Legacy
    # centerline Path + scalar target speed remains supported.
    trajectory_profile_topic: /planning/trajectory_profile
    use_typed_trajectory_profiles: true
    target_speed_topic: /planning/target_speed
    planning_ready_topic: /planning/ready
    localization_state_topic: /localization/pose_hint_state
    odometry_topic: /visual_slam/tracking/odometry
    opponent_odometry_topic: /perception/opponent/odometry
    command_topic: /auto/control_cmd
    diagnostics_topic: /controller/diagnostics
    tracking_markers_topic: /controller/tracking_markers

    # Every required input has a steady-clock watchdog. A timeout produces a stop.
    control_rate_hz: 30.0
    trajectory_timeout_s: 0.5
    odometry_timeout_s: 0.3
    target_speed_timeout_s: 0.5
    opponent_odometry_timeout_s: 0.3
    transform_timeout_s: 0.05
    transform_max_age_s: 0.5
    require_planning_ready: true
    require_localization_state: true
    localization_state_timeout_s: 1.5
    require_target_speed: true
    fallback_target_speed_mps: 0.5
    max_target_speed_mps: 3.0
    stop_at_path_end: true
    goal_tolerance_m: 0.25

    # Neutral is the portable default across PCA9685 and VESC. Increase only after
    # confirming the vehicle-specific brake direction/current on a stand.
    safety_brake_command: 0.0

    # Pure Pursuit lateral controller.
    wheelbase_m: 0.26
    min_lookahead_m: 0.5
    max_lookahead_m: 2.0
    lookahead_speed_gain_s: 0.4
    max_steering_angle_rad: 0.45
    max_steering_command: 1.0
    max_steering_rate_per_s: 4.0
    # auto: endpoints within tolerance; closed/open: explicit behavior.
    path_closure_mode: auto
    closed_path_tolerance_m: 0.3

    # MAP-like pursuit adds lateral-error compensation and reduces steering at speed.
    map_lateral_error_gain: 0.4
    map_speed_steering_downscale_start_mps: 1.5
    map_speed_steering_downscale_end_mps: 3.0
    map_speed_steering_downscale_factor: 0.25

    # Lightweight kinematic bicycle MPC. This optimizes steering only; longitudinal
    # speed control, acceleration limits and trailing remain handled outside it.
    mpc_horizon_steps: 12
    mpc_time_step_s: 0.05
    mpc_steering_samples: 15
    mpc_min_prediction_speed_mps: 0.2
    mpc_path_error_weight: 4.0
    mpc_heading_error_weight: 0.8
    mpc_steering_weight: 0.15
    mpc_terminal_path_error_weight: 2.0

    # Simple bounded longitudinal controller. A lateral-acceleration limit reduces
    # target speed in tight curves before throttle/brake are calculated.
    throttle_kp: 0.5
    throttle_feedforward: 0.05
    brake_kp: 0.5
    speed_deadband_mps: 0.05
    max_throttle_command: 0.35
    max_brake_command: 0.3
    max_lateral_accel_mps2: 2.0
    # Use the minimum custom/raceline speed inside this forward window so the
    # controller starts slowing before a manually marked slow section.
    trajectory_speed_lookahead_m: 0.5
    # Optional use of the CSV ax column; zero preserves legacy behavior.
    throttle_acceleration_feedforward: 0.0
    brake_deceleration_feedforward: 0.0

    # Optional opponent trailing. When enabled, opponent odometry is projected onto
    # the active trajectory and target speed is reduced to keep this gap.
    trailing_enabled: false
    trailing_gap_m: 1.5
    trailing_kp: 0.5
    trailing_ki: 0.001
    trailing_kd: 0.2
    trailing_max_gap_m: 8.0
    trailing_min_command_speed_mps: 0.0
