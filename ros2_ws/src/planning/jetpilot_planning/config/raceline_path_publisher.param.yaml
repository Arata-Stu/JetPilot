/**:
  ros__parameters:
    # The node is only started explicitly by enable_raceline_publisher=true.
    # raceline_csv is required. Set raceline_root to the selected map directory
    # and use the generated <map>_raceline.csv filename for containment checks.
    raceline_root: ""
    raceline_csv: ""
    output_topic: /planning/raceline_path
    trajectory_output_topic: /planning/raceline_trajectory
    publish_typed_trajectory: true
    line_id: raceline
    line_name: Raceline
    # Optional startup-only integrity check. Hot reloads always publish the
    # newly computed CSV hash, so GUI saves are not pinned to this value.
    source_hash: ""
    closed: true
    frame_id: map
    # Watch GUI atomic replacements. An invalid/missing revision publishes an
    # empty Path/Trajectory once so the route selector fails closed.
    reload_interval_sec: 0.5
    max_file_bytes: 16777216
    max_points: 200000
    use_sim_time: false
