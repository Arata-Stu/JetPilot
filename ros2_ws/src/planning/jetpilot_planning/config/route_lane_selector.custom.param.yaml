/**:
  ros__parameters:
    lane_ids: [primary, custom]
    lane_path_topics: [/hd_map/primary_centerline_path, /planning/custom_path]
    # The custom candidate is received as one typed message so its geometry,
    # per-point speed, line ID and source hash cannot be mixed across revisions.
    lane_trajectory_topics: ["", /planning/custom_trajectory]
    lane_target_speeds_mps: [1.0, 3.0]
    default_lane_id: custom
    fallback_to_default_lane: false

    requested_lane_topic: /planning/requested_lane
    current_section_topic: /localization/current_section
    output_trajectory_topic: /planning/trajectory
    output_profile_topic: /planning/trajectory_profile
    target_speed_topic: /planning/target_speed
    selected_lane_topic: /planning/selected_lane
    ready_topic: /planning/ready
    diagnostics_topic: /planning/diagnostics

    publish_rate_hz: 10.0
    path_timeout_sec: 0.0
    requested_lane_timeout_sec: 1.0
    require_requested_lane_heartbeat: false
    current_section_timeout_sec: 1.0
    min_path_poses: 2
    min_path_length_m: 0.10
    use_sim_time: false
