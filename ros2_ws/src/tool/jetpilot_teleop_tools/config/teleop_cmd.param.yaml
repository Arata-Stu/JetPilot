teleop_cmd_node:
  ros__parameters:
    steering_axis: 0
    throttle_axis: 5
    reverse_axis: 2
    brake_button: -1
    deadman_button: 3
    # Normalize the observed joystick axis so stick-left is positive in ROS.
    steering_scale: -1.0
    throttle_scale: 1.0
    reverse_scale: 1.0
    brake_value: 1.0
    deadzone: 0.05
    trigger_min: -1.0
    trigger_max: 1.0
    throttle_trigger_min: -1.0
    throttle_trigger_max: 1.0
    throttle_trigger_inverted: false
    reverse_trigger_min: -1.0
    reverse_trigger_max: 1.0
    reverse_trigger_inverted: false
