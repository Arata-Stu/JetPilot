e2e_image_encoder:
  ros__parameters:
    input_width: 212
    input_height: 120
    input_tensor_name: input_tensor
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

e2e_control_decoder:
  ros__parameters:
    output_tensor_name: output_tensor
    output_fields: [steering, throttle]
    steering_min: -1.0
    steering_max: 1.0
    throttle_min: 0.0
    throttle_max: 1.0
    stale_timeout_sec: 0.2
