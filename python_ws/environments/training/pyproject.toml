[project]
name = "jetpilot-training-environment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["gpu", "tools"]

[dependency-groups]
gpu = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "numpy==2.4.6",
  "onnxruntime-gpu==1.27.0"
]
tools = [
  "numpy==2.4.6",
  "opencv-python==4.13.0.92",
  "tqdm==4.68.2",
  "rosbags==0.11.3",
  "omegaconf==2.3.1",
  "hydra-core==1.3.3",
  "PyYAML==6.0.2",
  "tensorboard==2.20.0",
  "onnx==1.21.0",
  "onnxslim>=0.1,<1",
  "onnxscript==0.7.1",
  "matplotlib==3.11.0",
  "scipy==1.17.1",
  "quadprog==0.1.13",
  "optuna>=4.0,<6.0",
  "ultralytics>=8.3,<9"
]
