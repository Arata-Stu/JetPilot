bag_path: ""
output_dir: datasets/e2e/default
dataset_dir: datasets/e2e/default
# temporal: split every selected dataset by time. explicit: use the separate
# validation_dataset_dirs without taking validation samples from training bags.
dataset_dirs: []
validation_dataset_dirs: []
split_mode: temporal

image_topic: /realsense/color/image_raw
control_topic: /teleop/control_cmd
odometry_topic: /visual_slam/tracking/odometry
imu_topic: /realsense/imu
task: control

# Sensor presets:
# 424x240 -> 212x120
# 640x480 -> 320x240
input_width: 212
input_height: 120
input_channels: 3

max_control_dt_sec: 0.1
# Match Offline Analysis by using one bag-recording clock for every stream.
# Select header only when sensor and control header clocks are synchronized.
timestamp_source: bag
max_odometry_dt_sec: 0.15
trajectory_horizon_sec: 1.5
trajectory_points: 10
trajectory_scale_m: 5.0
imu_window_sec: 0.5
imu_samples: 10
image_extension: jpg
jpeg_quality: 92

# image: conventional RGB/event_image input. event_tensor: decode raw EventPacket
# and persist causal [2B,H,W] training tensors at sample_hz.
modality: image
event_topic: /event_camera/events
event_bins: 10
event_window_ms: 40.0
event_stride_ms: 4.0
event_polarity_mode: separate
event_polarity_layout: polarity_major
event_temporal_interpolation: none
sample_hz: 10.0
event_sample_hz: 250.0
rollout_steps: 32

# Async RGB-EVS training can resample a dense 250 Hz source sequence without
# fabricating tensors or timestamps. Validation always uses the recorded cadence.
timing_augmentation: false
timing_min_hz: 100.0
timing_max_hz: 250.0
timing_jitter_fraction: 0.15
event_update_drop_probability: 0.05
rgb_update_drop_probability: 0.10
max_rgb_interval_multiplier: 2
# false: decode RGB and run frozen DINOv3 every epoch (legacy behavior).
# true: cache the frozen CLS feature once per image and reuse it across runs.
rgb_feature_cache: false
event_mean: [0.0]
event_std: [1.0]

fraction: 1.0
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
