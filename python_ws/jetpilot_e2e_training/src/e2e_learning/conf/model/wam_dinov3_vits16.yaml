name: wam_dinov3_vits16
backbone: dinov3_vits16
task: control
training_objective: wam
output_dim: 2
outputs: [steering, throttle]
steering_only: false

# DINOv3-compatible visual encoder shared by observation and future targets.
input_width: 212
input_height: 120
input_channels: 3
patch_size: 16
embed_dim: 384
depth: 12
num_heads: 6
ffn_ratio: 4.0
storage_tokens: 4
layer_scale: 0.00001
rope_base: 100.0
rope_rescale_coords: 2.0
weights_path: ""
require_weights: false
trusted_checkpoint: false

# Phase 1 deterministic Tiny WAM. The dynamics implementation is replaceable
# by an RSSM later without changing the dataset or TensorRT state boundary.
temporal: deterministic_gru
sequence_length: 4
frame_stride: 1
future_horizon: 6
future_stride: 1
latent_dim: 256
hidden_dim: 256
current_action_loss_weight: 1.0
future_action_loss_weight: 0.5
future_latent_loss_weight: 1.0
